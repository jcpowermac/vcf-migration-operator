apiVersion: migration.openshift.io/v1alpha1
kind: VmwareCloudFoundationMigration
metadata:
  labels:
    app.kubernetes.io/name: vcf-migration-operator
    app.kubernetes.io/managed-by: kustomize
  name: cluster
spec:
  state: Pending
  targetVCenterCredentialsSecret:
    name: target-vcenter-creds
    namespace: openshift-vcf-migration
  # nodeMigration controls how nodes move to the target vCenter.
  # When omitted, the operator uses the MachineSet/CPMS replacement path (IPI).
  #
  # IPI cluster — omit nodeMigration entirely, or set type: Recreate:
  # nodeMigration:
  #   workers:
  #     type: Recreate
  #   controlPlane:
  #     type: Recreate
  #
  # UPI cluster — no MachineSets/CPMS, must use VMotion:
  # nodeMigration:
  #   workers:
  #     type: VMotion
  #     vmotion:
  #       mode: Auto            # Auto | Hot | Cold (default: Auto)
  #     maxUnavailable: 25%
  #   controlPlane:
  #     type: VMotion
  #     maxUnavailable: 1
  failureDomains:
    - name: target-fd-1
      region: target-region
      zone: target-zone-1
      server: vcenter-target.example.com
      topology:
        datacenter: TargetDC
        computeCluster: /TargetDC/host/TargetCluster
        datastore: /TargetDC/datastore/TargetDatastore
        networks:
          - "VM Network"
        resourcePool: /TargetDC/host/TargetCluster/Resources
        template: /TargetDC/vm/rhcos-template
        folder: /TargetDC/vm/my-cluster-infra-id
