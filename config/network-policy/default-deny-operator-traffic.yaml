# Make the operator pod's ingress and egress restrictions explicit. Ingress is
# limited to metrics scraping; egress is allow-all (see allow-all-egress.yaml).
# Policy rules are additive, so allow-all-egress is the effective egress policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/name: vcf-migration-operator
    app.kubernetes.io/managed-by: kustomize
  name: default-deny-operator-traffic
  namespace: system
spec:
  podSelector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: vcf-migration-operator
  policyTypes:
    - Ingress
    - Egress
