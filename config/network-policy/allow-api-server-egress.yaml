# NetworkPolicy cannot select the host-networked API server endpoints. Keep
# this broad rule so controller-runtime and the OpenShift clients can connect
# regardless of the cluster API address and port.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/name: vcf-migration-operator
    app.kubernetes.io/managed-by: kustomize
  name: allow-api-server-egress
  namespace: system
spec:
  podSelector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: vcf-migration-operator
  egress:
    - {}
  policyTypes:
    - Egress
