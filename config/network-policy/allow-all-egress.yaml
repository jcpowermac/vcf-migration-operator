# NetworkPolicy egress rules are additive, so this single rule defines the
# operator's whole egress policy: allow-all. Destination-based scoping is not
# practical here — the API server endpoints are host-networked and cannot be
# selected, and vCenter and OVA URLs are configured at runtime. The
# default-deny for egress documents intent; this rule is the actual policy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  labels:
    app.kubernetes.io/name: vcf-migration-operator
    app.kubernetes.io/managed-by: kustomize
  name: allow-all-egress
  namespace: system
spec:
  podSelector:
    matchLabels:
      control-plane: controller-manager
      app.kubernetes.io/name: vcf-migration-operator
  egress:
    - {}
  policyTypes:
    - Egress
