apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.21.0
  creationTimestamp: null
  name: vmwarecloudfoundationmigrations.migration.openshift.io
spec:
  group: migration.openshift.io
  names:
    categories:
    - migration
    kind: VmwareCloudFoundationMigration
    listKind: VmwareCloudFoundationMigrationList
    plural: vmwarecloudfoundationmigrations
    shortNames:
    - vcfm
    singular: vmwarecloudfoundationmigration
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.state
      name: State
      type: string
    - jsonPath: .status.conditions[?(@.type=="Ready")].status
      name: Ready
      type: string
    - jsonPath: .status.completionTime
      name: Completed
      type: date
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: |-
          VmwareCloudFoundationMigration is the Schema for the vmwarecloudfoundationmigrations API.
          It orchestrates migration of an OpenShift cluster from one vCenter to another.
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of VmwareCloudFoundationMigration.
            properties:
              failureDomains:
                description: |-
                  failureDomains defines failure domains for the target vCenter. The embedded
                  element type intentionally tracks config.openshift.io/v1 VSpherePlatformFailureDomainSpec
                  (including Name, Region, Zone, Server, and Topology) to align with OpenShift API
                  failure domain semantics; the schema is re-inlined on "make manifests" after
                  dependency bumps. Legacy and Recreate configurations require topology.template;
                  VMotion does not use a template and consumes the resolved mapping from preflight.
                items:
                  description: VSpherePlatformFailureDomainSpec holds the region and
                    zone failure domain and the vCenter topology of that failure domain.
                  properties:
                    name:
                      description: |-
                        name defines the arbitrary but unique name
                        of a failure domain.
                      maxLength: 256
                      minLength: 1
                      type: string
                    region:
                      description: |-
                        region defines the name of a region tag that will
                        be attached to a vCenter datacenter. The tag
                        category in vCenter must be named openshift-region.
                      maxLength: 80
                      minLength: 1
                      type: string
                    regionAffinity:
                      description: |-
                        regionAffinity holds the type of region, Datacenter or ComputeCluster.
                        When set to Datacenter, this means the region is a vCenter Datacenter as defined in topology.
                        When set to ComputeCluster, this means the region is a vCenter Cluster as defined in topology.
                      properties:
                        type:
                          description: |-
                            type determines the vSphere object type for a region within this failure domain.
                            Available types are Datacenter and ComputeCluster.
                            When set to Datacenter, this means the vCenter Datacenter defined is the region.
                            When set to ComputeCluster, this means the vCenter cluster defined is the region.
                          enum:
                          - ComputeCluster
                          - Datacenter
                          type: string
                      required:
                      - type
                      type: object
                    server:
                      description: |-
                        server is the fully-qualified domain name or the IP address of the vCenter server.
                        This must match the server field of an entry in the vcenters list.
                        The match is case-sensitive; the value must be specified exactly as it appears in the vcenters entry.
                        The value must be between 1 and 255 characters long.
                      maxLength: 255
                      minLength: 1
                      type: string
                    topology:
                      description: topology describes a given failure domain using
                        vSphere constructs
                      properties:
                        computeCluster:
                          description: |-
                            computeCluster the absolute path of the vCenter cluster
                            in which virtual machine will be located.
                            The absolute path is of the form /<datacenter>/host/<cluster>.
                            The maximum length of the path is 2048 characters.
                          maxLength: 2048
                          pattern: ^/.*?/host/.*?
                          type: string
                        datacenter:
                          description: |-
                            datacenter is the name of vCenter datacenter in which virtual machines will be located.
                            The maximum length of the datacenter name is 80 characters.
                          maxLength: 80
                          type: string
                        datastore:
                          description: |-
                            datastore is the absolute path of the datastore in which the
                            virtual machine is located.
                            The absolute path is of the form /<datacenter>/datastore/<datastore>
                            The maximum length of the path is 2048 characters.
                          maxLength: 2048
                          pattern: ^/.*?/datastore/.*?
                          type: string
                        folder:
                          description: |-
                            folder is the absolute path of the folder where
                            virtual machines are located. The absolute path
                            is of the form /<datacenter>/vm/<folder>.
                            The maximum length of the path is 2048 characters.
                          maxLength: 2048
                          pattern: ^/.*?/vm/.*?
                          type: string
                        networks:
                          description: |-
                            networks is the list of port group network names within this failure domain.
                            If feature gate VSphereMultiNetworks is enabled, up to 10 network adapters may be defined.
                            10 is the maximum number of virtual network devices which may be attached to a VM as defined by:
                            https://configmax.esp.vmware.com/guest?vmwareproduct=vSphere&release=vSphere%208.0&categories=1-0
                            The available networks (port groups) can be listed using
                            `govc ls 'network/*'`
                            Networks should be in the form of an absolute path:
                            /<datacenter>/network/<portgroup>.
                          items:
                            type: string
                          minItems: 1
                          type: array
                          x-kubernetes-list-type: atomic
                        resourcePool:
                          description: |-
                            resourcePool is the absolute path of the resource pool where virtual machines will be
                            created. The absolute path is of the form /<datacenter>/host/<cluster>/Resources/<resourcepool>.
                            The maximum length of the path is 2048 characters.
                          maxLength: 2048
                          pattern: ^/.*?/host/.*?/Resources.*
                          type: string
                        template:
                          description: |-
                            template is the full inventory path of the virtual machine or template
                            that will be cloned when creating new machines in this failure domain.
                            The maximum length of the path is 2048 characters.

                            When omitted, the template will be calculated by the control plane
                            machineset operator based on the region and zone defined in
                            VSpherePlatformFailureDomainSpec.
                            For example, for zone=zonea, region=region1, and infrastructure name=test,
                            the template path would be calculated as /<datacenter>/vm/test-rhcos-region1-zonea.
                          maxLength: 2048
                          minLength: 1
                          pattern: ^/.*?/vm/.*?
                          type: string
                      required:
                      - computeCluster
                      - datacenter
                      - datastore
                      - networks
                      type: object
                    zone:
                      description: |-
                        zone defines the name of a zone tag that will
                        be attached to a vCenter cluster. The tag
                        category in vCenter must be named openshift-zone.
                      maxLength: 80
                      minLength: 1
                      type: string
                    zoneAffinity:
                      description: |-
                        zoneAffinity holds the type of the zone and the hostGroup which
                        vmGroup and the hostGroup names in vCenter corresponds to
                        a vm-host group of type Virtual Machine and Host respectively. Is also
                        contains the vmHostRule which is an affinity vm-host rule in vCenter.
                      properties:
                        hostGroup:
                          description: |-
                            hostGroup holds the vmGroup and the hostGroup names in vCenter
                            corresponds to a vm-host group of type Virtual Machine and Host respectively. Is also
                            contains the vmHostRule which is an affinity vm-host rule in vCenter.
                          properties:
                            hostGroup:
                              description: |-
                                hostGroup is the name of the vm-host group of type host within vCenter for this failure domain.
                                hostGroup is limited to 80 characters.
                                This field is required when the VSphereFailureDomain ZoneType is HostGroup
                              maxLength: 80
                              minLength: 1
                              type: string
                            vmGroup:
                              description: |-
                                vmGroup is the name of the vm-host group of type virtual machine within vCenter for this failure domain.
                                vmGroup is limited to 80 characters.
                                This field is required when the VSphereFailureDomain ZoneType is HostGroup
                              maxLength: 80
                              minLength: 1
                              type: string
                            vmHostRule:
                              description: |-
                                vmHostRule is the name of the affinity vm-host rule within vCenter for this failure domain.
                                vmHostRule is limited to 80 characters.
                                This field is required when the VSphereFailureDomain ZoneType is HostGroup
                              maxLength: 80
                              minLength: 1
                              type: string
                          required:
                          - hostGroup
                          - vmGroup
                          - vmHostRule
                          type: object
                        type:
                          description: |-
                            type determines the vSphere object type for a zone within this failure domain.
                            Available types are ComputeCluster and HostGroup.
                            When set to ComputeCluster, this means the vCenter cluster defined is the zone.
                            When set to HostGroup, hostGroup must be configured with hostGroup, vmGroup and vmHostRule and
                            this means the zone is defined by the grouping of those fields.
                          enum:
                          - HostGroup
                          - ComputeCluster
                          type: string
                      required:
                      - type
                      type: object
                      x-kubernetes-validations:
                      - message: hostGroup is required when type is HostGroup, and
                          forbidden otherwise
                        rule: 'has(self.type) && self.type == ''HostGroup'' ?  has(self.hostGroup)
                          : !has(self.hostGroup)'
                  required:
                  - name
                  - region
                  - server
                  - topology
                  - zone
                  type: object
                minItems: 1
                type: array
                x-kubernetes-list-type: atomic
              nodeMigration:
                description: |-
                  nodeMigration controls how nodes move to the target vCenter.
                  When omitted, the operator keeps the current MachineSet/CPMS replacement path.
                  When set, both roles select the same migration engine.
                properties:
                  controlPlane:
                    description: |-
                      controlPlane defines the migration engine and rolling limit for
                      control-plane nodes. This field is required and maxUnavailable must be 1.
                    properties:
                      maxUnavailable:
                        default: 1
                        description: |-
                          maxUnavailable is the maximum number of nodes in this role that can migrate
                          simultaneously. It must be an integer from 1 through 32767 and defaults to
                          1 when omitted; percentage strings are not accepted. The control-plane value
                          must be 1, and VMotion worker values must be 1.
                        format: int32
                        maximum: 32767
                        minimum: 1
                        type: integer
                      type:
                        description: |-
                          type is the migration engine for this role: `VMotion` relocates existing
                          VMs, while `Recreate` replaces VMs through MachineSets/CPMS. Required.
                        enum:
                        - VMotion
                        - Recreate
                        type: string
                      vmotion:
                        description: |-
                          vmotion contains VMotion-specific behavior. Required when type is
                          `VMotion` and forbidden when type is `Recreate`.
                        properties:
                          mode:
                            description: |-
                              mode explicitly selects `Hot` (live relocation) or `Cold` (graceful
                              shutdown before relocation). There is no default or fallback mode.
                            enum:
                            - Hot
                            - Cold
                            type: string
                        required:
                        - mode
                        type: object
                    required:
                    - type
                    type: object
                    x-kubernetes-validations:
                    - message: vmotion is required when type is VMotion, and forbidden
                        otherwise
                      rule: 'self.type == ''VMotion'' ? has(self.vmotion) : !has(self.vmotion)'
                  recoveryRequest:
                    description: |-
                      recoveryRequest asks the operator to recheck one blocked action. When omitted,
                      no recovery recheck is requested. It is an action-bound request, not evidence
                      that the action is inactive or authority to replay it. Runtime validation and
                      authorization are not performed by schema.
                    properties:
                      actionID:
                        description: actionID identifies the specific blocked action
                          being rechecked. Required UUID.
                        format: uuid
                        type: string
                      executionID:
                        description: executionID identifies the frozen execution being
                          rechecked. Required UUID.
                        format: uuid
                        type: string
                      reason:
                        description: reason is an optional administrator note of at
                          most 1024 characters.
                        maxLength: 1024
                        type: string
                      requestID:
                        description: requestID uniquely identifies this acknowledgement
                          request. Required UUID.
                        example: 11111111-1111-4111-8111-111111111111
                        format: uuid
                        type: string
                    required:
                    - actionID
                    - executionID
                    - requestID
                    type: object
                  workers:
                    description: |-
                      workers defines the migration engine and rolling limit for worker nodes.
                      This field is required.
                    properties:
                      maxUnavailable:
                        default: 1
                        description: |-
                          maxUnavailable is the maximum number of nodes in this role that can migrate
                          simultaneously. It must be an integer from 1 through 32767 and defaults to
                          1 when omitted; percentage strings are not accepted. The control-plane value
                          must be 1, and VMotion worker values must be 1.
                        format: int32
                        maximum: 32767
                        minimum: 1
                        type: integer
                      type:
                        description: |-
                          type is the migration engine for this role: `VMotion` relocates existing
                          VMs, while `Recreate` replaces VMs through MachineSets/CPMS. Required.
                        enum:
                        - VMotion
                        - Recreate
                        type: string
                      vmotion:
                        description: |-
                          vmotion contains VMotion-specific behavior. Required when type is
                          `VMotion` and forbidden when type is `Recreate`.
                        properties:
                          mode:
                            description: |-
                              mode explicitly selects `Hot` (live relocation) or `Cold` (graceful
                              shutdown before relocation). There is no default or fallback mode.
                            enum:
                            - Hot
                            - Cold
                            type: string
                        required:
                        - mode
                        type: object
                    required:
                    - type
                    type: object
                    x-kubernetes-validations:
                    - message: vmotion is required when type is VMotion, and forbidden
                        otherwise
                      rule: 'self.type == ''VMotion'' ? has(self.vmotion) : !has(self.vmotion)'
                required:
                - controlPlane
                - workers
                type: object
                x-kubernetes-validations:
                - message: controlPlane.maxUnavailable must be 1
                  rule: self.controlPlane.maxUnavailable == 1
                - message: workers and controlPlane must use the same migration type
                  rule: self.workers.type == self.controlPlane.type
                - message: workers and controlPlane must use the same VMotion mode
                  rule: self.workers.type != 'VMotion' || self.controlPlane.type !=
                    'VMotion' || !has(self.workers.vmotion) || !has(self.controlPlane.vmotion)
                    || !has(self.workers.vmotion.mode) || !has(self.controlPlane.vmotion.mode)
                    || self.workers.vmotion.mode == self.controlPlane.vmotion.mode
                - message: VMotion workers.maxUnavailable must be 1
                  rule: self.workers.type != 'VMotion' || !has(self.workers.maxUnavailable)
                    || self.workers.maxUnavailable == 1
              state:
                default: Pending
                description: |-
                  state controls the workflow: Pending, Running, Paused.
                  The migration workflow only executes when state is Running.
                  When omitted, defaults to Pending.
                enum:
                - Pending
                - Running
                - Paused
                type: string
              targetVCenterCredentialsSecret:
                description: |-
                  targetVCenterCredentialsSecret references the secret containing target vCenter credentials.
                  The secret must contain keys: {target-vcenter-fqdn}.username and {target-vcenter-fqdn}.password.
                properties:
                  name:
                    description: name is the secret name.
                    maxLength: 253
                    minLength: 1
                    type: string
                  namespace:
                    description: |-
                      namespace is the secret namespace. When omitted, defaults to the namespace
                      of the VmwareCloudFoundationMigration object.
                    type: string
                required:
                - name
                type: object
            required:
            - failureDomains
            - targetVCenterCredentialsSecret
            type: object
            x-kubernetes-validations:
            - message: topology.template is required for legacy and Recreate configurations
              rule: (has(self.nodeMigration) && self.nodeMigration.workers.type ==
                'VMotion' && self.nodeMigration.controlPlane.type == 'VMotion') ||
                self.failureDomains.all(fd, has(fd.topology.template) && size(fd.topology.template)
                > 0)
          status:
            description: status defines the observed state of VmwareCloudFoundationMigration.
            properties:
              completionSpecHash:
                description: |-
                  completionSpecHash is the lowercase hex SHA-256 of encoding/json.Marshal
                  of the typed spec when Ready=True is established. With Ready=True and
                  completionTime, a matching hash authorizes automatic record release even
                  when deletion increments generation. When omitted, administrator handoff
                  is required to release the record.
                pattern: ^[a-f0-9]{64}$
                type: string
              completionTime:
                description: completionTime is when the migration completed.
                format: date-time
                type: string
              conditions:
                description: |-
                  conditions represent the current state of the migration.
                  Known conditions are:
                  - Accepted: admission gate; True is normal for the single reconciled instance
                    (openshift-vcf-migration/cluster), while False indicates an unsupported
                    object name or namespace.
                  - InfrastructurePrepared: preflight validation and migration path selection.
                  - DestinationInitialized: destination vCenter folders and tags created.
                  - MultiSiteConfigured: cluster configured for both source and target vCenters.
                  - WorkloadMigrated: workloads migrated to destination vCenter machine sets.
                  - SourceCleaned: source vCenter references removed and cleaned up.
                  - Ready: aggregate condition indicating migration is complete and cluster is healthy.
                  For stage conditions (InfrastructurePrepared through Ready), False is normal while
                  progressing; True indicates the stage has completed. Stages execute in order.
                items:
                  description: Condition contains details for one aspect of the current
                    state of this API Resource.
                  properties:
                    lastTransitionTime:
                      description: |-
                        lastTransitionTime is the last time the condition transitioned from one status to another.
                        This should be when the underlying condition changed.  If that is not known, then using the time when the API field changed is acceptable.
                      format: date-time
                      type: string
                    message:
                      description: |-
                        message is a human readable message indicating details about the transition.
                        This may be an empty string.
                      maxLength: 32768
                      type: string
                    observedGeneration:
                      description: |-
                        observedGeneration represents the .metadata.generation that the condition was set based upon.
                        For instance, if .metadata.generation is currently 12, but the .status.conditions[x].observedGeneration is 9, the condition is out of date
                        with respect to the current state of the instance.
                      format: int64
                      minimum: 0
                      type: integer
                    reason:
                      description: |-
                        reason contains a programmatic identifier indicating the reason for the condition's last transition.
                        Producers of specific condition types may define expected values and meanings for this field,
                        and whether the values are considered a guaranteed API.
                        The value should be a CamelCase string.
                        This field may not be empty.
                      maxLength: 1024
                      minLength: 1
                      pattern: ^[A-Za-z]([A-Za-z0-9_,:]*[A-Za-z0-9_])?$
                      type: string
                    status:
                      description: status of the condition, one of True, False, Unknown.
                      enum:
                      - "True"
                      - "False"
                      - Unknown
                      type: string
                    type:
                      description: type of condition in CamelCase or in foo.example.com/CamelCase.
                      maxLength: 316
                      pattern: ^([a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*/)?(([A-Za-z0-9][-A-Za-z0-9_.]*)?[A-Za-z0-9])$
                      type: string
                  required:
                  - lastTransitionTime
                  - message
                  - reason
                  - status
                  - type
                  type: object
                type: array
                x-kubernetes-list-map-keys:
                - type
                x-kubernetes-list-type: map
              lastUpdateTime:
                description: lastUpdateTime is when the migration status was last
                  updated.
                format: date-time
                type: string
              nodeMigration:
                description: |-
                  nodeMigration reports per-node move progress.
                  Nil when the MachineSet/CPMS replacement path is used.
                properties:
                  activeAction:
                    description: |-
                      activeAction is the single action claim currently being observed. A claim
                      without a task reference means submission may have begun and is not safe to retry.
                    properties:
                      actionID:
                        description: actionID is the UUID stable for this one mutating
                          action.
                        format: uuid
                        type: string
                      claimedAt:
                        description: claimedAt is when the durable claim was written.
                        format: date-time
                        type: string
                      deadline:
                        description: deadline is the bounded action deadline, if set
                          by the implementation.
                        format: date-time
                        type: string
                      executionID:
                        description: executionID binds this action to the frozen execution;
                          it is a UUID.
                        format: uuid
                        type: string
                      kind:
                        description: |-
                          kind is the mutating operation claimed. When set to `ShutdownGuest`, the
                          guest is asked to shut down; when set to `RelocateVM`, the VM is relocated;
                          when set to `PowerOnVM`, the VM is powered on.
                        enum:
                        - ShutdownGuest
                        - RelocateVM
                        - PowerOnVM
                        type: string
                      lastObservedAt:
                        description: lastObservedAt is the latest observation time,
                          if any.
                        format: date-time
                        type: string
                      nodeName:
                        description: |-
                          nodeName identifies the Kubernetes Node. Required, non-empty, and at most
                          253 characters.
                        maxLength: 253
                        minLength: 1
                        type: string
                      nodeUID:
                        description: nodeUID is the non-empty Kubernetes UID of the
                          selected Node object.
                        minLength: 1
                        type: string
                      observationState:
                        description: |-
                          observationState records the latest action observation. `NotObserved` means
                          no authoritative observation is recorded; `Running` means the action is in
                          progress; `Succeeded` means the action was observed successful; `Failed`
                          means it was observed unsuccessful; `Unknown` means the outcome cannot be
                          established.
                        enum:
                        - NotObserved
                        - Running
                        - Succeeded
                        - Failed
                        - Unknown
                        type: string
                      operationIdentity:
                        description: |-
                          operationIdentity is a digest of sanitized, non-secret intended-operation
                          inputs. It must be exactly 64 lowercase hexadecimal characters.
                        pattern: ^[a-f0-9]{64}$
                        type: string
                      ownerVCenter:
                        description: |-
                          ownerVCenter is the non-empty vCenter in which this action/task is
                          interpreted; it is at most 512 characters.
                        maxLength: 512
                        minLength: 1
                        type: string
                      reason:
                        description: reason is an optional observation/outcome detail
                          of at most 1024 characters.
                        maxLength: 1024
                        type: string
                      submissionState:
                        description: |-
                          submissionState reports submission status. When set to `Claimed`, submission
                          may have begun; `Submitted` means it was acknowledged; `Unknown` means its
                          outcome cannot be established.
                        enum:
                        - Claimed
                        - Submitted
                        - Unknown
                        type: string
                      submittedAt:
                        description: submittedAt is when submission was acknowledged,
                          if known.
                        format: date-time
                        type: string
                      taskReference:
                        description: |-
                          taskReference is optional; `ShutdownGuest` has no task reference. When
                          present, its ownerVCenter must match this action's ownerVCenter.
                        properties:
                          ownerVCenter:
                            description: |-
                              ownerVCenter scopes taskID to one vCenter. Required, non-empty, and at most
                              512 characters.
                            maxLength: 512
                            minLength: 1
                            type: string
                          taskID:
                            description: |-
                              taskID is the vCenter-local task identifier. Required, non-empty, and at
                              most 512 characters.
                            maxLength: 512
                            minLength: 1
                            type: string
                        required:
                        - ownerVCenter
                        - taskID
                        type: object
                      vmBIOSUUID:
                        description: |-
                          vmBIOSUUID is the non-empty VM BIOS UUID, not the vSphere instanceUUID. It
                          is at most 64 characters.
                        maxLength: 64
                        minLength: 1
                        type: string
                    required:
                    - actionID
                    - claimedAt
                    - executionID
                    - kind
                    - nodeName
                    - nodeUID
                    - observationState
                    - operationIdentity
                    - ownerVCenter
                    - submissionState
                    - vmBIOSUUID
                    type: object
                    x-kubernetes-validations:
                    - message: taskReference.ownerVCenter must match ownerVCenter
                      rule: '!has(self.taskReference) || self.taskReference.ownerVCenter
                        == self.ownerVCenter'
                    - message: ShutdownGuest does not have a task reference
                      rule: self.kind != 'ShutdownGuest' || !has(self.taskReference)
                  cleanup:
                    description: |-
                      cleanup is bounded progress for source-reference cleanup; it is observational
                      state and does not authorize cleanup.
                    properties:
                      lastTransitionTime:
                        description: lastTransitionTime is when phase last changed.
                        format: date-time
                        type: string
                      phase:
                        description: |-
                          phase is the current cleanup observation. `Pending` means cleanup has not
                          started; `RemovingSourceReferences` means source references are being
                          removed; `VerifyingReadiness` means readiness is being checked; `Completed`
                          means cleanup finished; `Blocked` means it cannot proceed.
                        enum:
                        - Pending
                        - RemovingSourceReferences
                        - VerifyingReadiness
                        - Completed
                        - Blocked
                        type: string
                      reason:
                        description: reason is an optional explanation of at most
                          1024 characters.
                        maxLength: 1024
                        type: string
                    required:
                    - phase
                    type: object
                  controlPlane:
                    description: 'controlPlane is control-plane progress: counts plus
                      per-node entries.'
                    properties:
                      failed:
                        description: failed is nodes in Failed.
                        format: int32
                        type: integer
                      inProgress:
                        description: inProgress is nodes in Preparing, Migrating,
                          or WaitingForNode.
                        format: int32
                        type: integer
                      nodes:
                        description: |-
                          nodes is per-node progress for this role, keyed by Kubernetes node name.
                          At most 500 entries are allowed.
                        items:
                          description: |-
                            NodeMigrationProgress is observed state for a single node/VM. When any outcome
