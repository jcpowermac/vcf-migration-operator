apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/openshift/vcf-migration-operator?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "false"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: event == "push" && target_branch == "v0.1"
  creationTimestamp: null
  labels:
    appstudio.openshift.io/application: vcf-migration-operator-0-1
    appstudio.openshift.io/component: vcf-migration-operator-bundle-0-1
    pipelines.appstudio.openshift.io/type: build
  name: vcf-migration-operator-bundle-on-push
  namespace: vcf-migration-operator-tenant
spec:
  params:
  - name: artifact-type
    value: operatorbundle
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/redhat-user-workloads/vcf-migration-operator-tenant/vcf-migration-operator-bundle-0-1:{{revision}}
  - name: dockerfile
    value: bundle.konflux.Dockerfile
  - name: path-context
    value: .
  - name: build-platforms
    value:
    - "linux/amd64"
  - name: hermetic
    value: "true"
  - name: prefetch-input
    value: ""
  - name: build-source-image
    value: "true"
  - name: build-image-index
    value: "false"
  pipelineRef:
    resolver: git
    params:
      - name: url
        value: https://github.com/openshift/vcf-migration-operator.git
      - name: revision
        value: main
      - name: pathInRepo
        value: .tekton/vcf-migration-operator-bundle-pipeline.yaml
  taskRunTemplate:
    serviceAccountName: build-pipeline-vcf-migration-operator-bundle-0-1
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}