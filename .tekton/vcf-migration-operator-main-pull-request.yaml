apiVersion: tekton.dev/v1
kind: PipelineRun
metadata:
  annotations:
    build.appstudio.openshift.io/repo: https://github.com/openshift/vcf-migration-operator?rev={{revision}}
    build.appstudio.redhat.com/commit_sha: '{{revision}}'
    build.appstudio.redhat.com/pull_request_number: '{{pull_request_number}}'
    build.appstudio.redhat.com/target_branch: '{{target_branch}}'
    pipelinesascode.tekton.dev/cancel-in-progress: "true"
    pipelinesascode.tekton.dev/max-keep-runs: "3"
    pipelinesascode.tekton.dev/on-cel-expression: event == "pull_request" && target_branch == "v0.1"
  creationTimestamp: null
  labels:
    appstudio.openshift.io/application: vcf-migration-operator-0-1
    appstudio.openshift.io/component: vcf-migration-operator-v0.1
    pipelines.appstudio.openshift.io/type: build
  name: vcf-migration-operator-on-pull-request
  namespace: vcf-migration-operator-tenant
spec:
  params:
  - name: git-url
    value: '{{source_url}}'
  - name: revision
    value: '{{revision}}'
  - name: output-image
    value: quay.io/redhat-user-workloads/vcf-migration-operator-tenant/vcf-migration-operator-0-1:on-pr-{{revision}}
  - name: dockerfile
    value: Dockerfile
  - name: path-context
    value: .
  - name: image-expires-after
    value: 5d
  - name: hermetic
    value: "true"
  - name: prefetch-input
    value: '{"packages": [{"type": "gomod"}], "flags": ["gomod-vendor-check"]}'
  - name: build-source-image
    value: "true"
  pipelineRef:
    resolver: git
    params:
      - name: url
        value: https://github.com/openshift/vcf-migration-operator.git
      - name: revision
        value: main
      - name: pathInRepo
        value: .tekton/vcf-migration-operator-pipeline.yaml
  taskRunTemplate:
    serviceAccountName: build-pipeline-vcf-migration-operator-0-1
  workspaces:
  - name: git-auth
    secret:
      secretName: '{{ git_auth_secret }}'
status: {}
